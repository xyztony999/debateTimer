name: Deploy API to Baota

# paths 实现"前后端独立发版"：只改前端时不重发后端；workflow_dispatch 可手动单发。
on:
  workflow_dispatch:
  push:
    branches: [deploy/production]
    paths:
      - 'server/**'
      - 'deploy/baota/**'
      - '.github/workflows/deploy-baota.yml'

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    if: ${{ vars.BAOTA_DEPLOY == 'true' }}
    steps:
      - name: Deploy API over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.BAOTA_SSH_HOST }}
          username: ${{ secrets.BAOTA_SSH_USER }}
          key: ${{ secrets.BAOTA_SSH_KEY }}
          port: ${{ secrets.BAOTA_SSH_PORT || '22' }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR=/www/wwwroot/debatetimer-api
            cd "$APP_DIR"
            git fetch origin
            git checkout deploy/production
            git pull --ff-only origin deploy/production
            bash "${APP_DIR}/deploy/baota/deploy.sh" --api-only
