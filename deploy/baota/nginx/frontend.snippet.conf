# 前端静态站点片段：把 build/ 托管在自有 Nginx 时使用（自部署拓扑 2，
# 见 deploy/selfhost/README.md；也可用于宝塔静态站点替代 GitHub Pages）。
# root 按实际站点目录调整；API 另走反代（api.snippet.conf）。

root /www/wwwroot/debatetimer.tonyxyz.com;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

# PWA service worker 必须回源校验，否则 autoUpdate 拿不到新版本
location = /sw.js {
    add_header Cache-Control "no-cache";
}
