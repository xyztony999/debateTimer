# 贴进宝塔网站 debatetimer.tonyxyz.com 的配置（server { } 内）。
# 网站根目录指向 SITE_DIR（例如 /www/wwwroot/debatetimer.tonyxyz.com）。

root /www/wwwroot/debatetimer.tonyxyz.com;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}
