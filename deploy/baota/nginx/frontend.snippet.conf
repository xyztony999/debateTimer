# 仅当把前端也放在宝塔时使用。当前生产前端走 GitHub Pages，一般不用本文件。

root /www/wwwroot/debatetimer.tonyxyz.com;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}
